name: Deploy to VPS

on:
  # Disparado pelos repos de serviço após build da imagem
  repository_dispatch:
    types: [deploy]

  # Permite rodar manualmente pela UI do GitHub
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH no VPS e deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            # Login no ghcr.io para poder fazer pull das imagens privadas
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u matheus-santos-da-silva --password-stdin

            cd /opt/money-track-infra

            # Atualiza o compose file caso tenha mudado
            GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key" git pull

            USERS_SERVICE_IMAGE=ghcr.io/matheus-santos-da-silva/users-service:latest FINANCE_SERVICE_IMAGE=ghcr.io/matheus-santos-da-silva/finance-service:latest docker compose -f docker-compose.prod.yml pull
            USERS_SERVICE_IMAGE=ghcr.io/matheus-santos-da-silva/users-service:latest FINANCE_SERVICE_IMAGE=ghcr.io/matheus-santos-da-silva/finance-service:latest docker compose -f docker-compose.prod.yml up -d

            # Remove imagens antigas para liberar espaço em disco
            docker image prune -f
